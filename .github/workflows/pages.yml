name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Decode images and fonts
        run: python3 scripts/decode-assets.py
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Prepare publish folder
        run: |
          mkdir -p publish
          cp index.html styles.css app.js events.json site.json manifest.json sw.js og-image.png .nojekyll publish/
          cp -r icons fonts images publish/
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: publish
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
